name: CI

on:
  push:
    branches:
      - dev
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
    branches:
      - dev
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm --prefix dashboard/dashboard-web run build

      - name: Backend syntax check
        run: |
          node --check dashboard/server/server.js
          node --check dashboard/server/src/swagger.js
